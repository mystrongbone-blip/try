<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放射師國考神器</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#14151b;--panel:#1a1b22;--border:#2b2d38;--text:#e8e8ee;--muted:#9aa0b0;--accent:#4f8cff;--accent2:#6ea8ff;--green:#39d98a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;color:#fff}
button{background:#262a36;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent);color:#fff}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.green{background:#0e9f6e;border-color:#0e9f6e;color:#fff}
button.purple{background:#7c3aed;border-color:#7c3aed;color:#fff}
button.red{background:#e11d48;border-color:#e11d48;color:#fff}
button.yellow{background:#f59e0b;border-color:#f59e0b;color:#111827}
.close-x{background:#e11d48 !important;color:#fff !important;border-color:#e11d48 !important}
#crumb{font-size:12px;color:var(--muted);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2c313f;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#home{flex:1;overflow-y:auto;padding:28px 40px}
#home h2{color:#fff;margin:8px 0 20px;font-size:22px}
#home .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.scard{background:linear-gradient(145deg,#232838,#1a1f2e);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:.2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.scard:hover{border-color:var(--accent);transform:translateY(-3px)}
.scard .icon{font-size:34px}
.scard .name{font-size:16px;font-weight:700;margin-top:10px}
.scard .cnt{font-size:12px;color:var(--muted);margin-top:4px}
.scard .tool{margin-top:4px;font-size:11px;padding:3px 8px}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.rbtn{background:#262a36;border:1px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.rbtn:hover{border-color:var(--accent);background:#2f3644}
.rbtn .tool{font-size:11px;padding:2px 6px}
#view{flex:1;display:none;min-height:0;flex-direction:column}
#viewTop,#libTools{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;background:#181a22;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:12px;color:var(--muted);position:relative;z-index:30}
.tool{border-radius:6px;padding:3px 8px;font-size:12px;border:1px solid var(--border);background:#262a36;color:var(--text)}
.tool.on{background:var(--accent);color:#fff}
input[type=color]{width:26px;height:22px;border:1px solid var(--border);border-radius:5px;background:transparent;padding:0;cursor:pointer}
.hl-btn{width:18px;height:16px;display:inline-block;cursor:pointer;border:1px solid #999;border-radius:5px}
#docWrap{flex:1;overflow-y:auto;background:#fff;padding:14px;position:relative}
#doc,.libq-body{max-width:1000px;margin:0 auto;background:#fff;font-size:17px;line-height:1.9;color:#222}
#doc p,#doc .options,.libq-body p,.libq-body .options{font-size:17px}
#doc h1,.libq-body h1{color:#333;border-bottom:3px solid #999;padding-bottom:8px}
#doc h2,.libq-body h2{color:#333;border-left:5px solid #cc0000;padding-left:10px;margin:38px 0 10px;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#doc .answer,.libq-body .answer{color:#cc0000;font-weight:bold;font-size:17px}
#doc .solution,#doc .know,#doc .sim,.libq-body .solution,.libq-body .know,.libq-body .sim{background:#f5f5f5;border:1.5px solid #999;border-radius:8px;padding:14px;margin:10px 0;font-size:16px;line-height:1.85}
#doc .know,.libq-body .know{background:#E3F2FD;border-color:#2196F3}
#doc .sim,.libq-body .sim{background:#E8F5E9;border-color:#4CAF50}
#doc table,.libq-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
#doc th,.libq-body th{background:#FFF3CD;border:1px solid #bbb;padding:8px;font-size:15px}
#doc td,.libq-body td{border:1px solid #bbb;padding:8px;vertical-align:top;font-size:15px}
#doc img,.libq-body img{max-width:100%}
#doc.hl-mode,#lib.hl-mode,#cmpRightR.hl-mode,.win-right.hl-mode,.win-body.hl-mode{cursor:crosshair}
#doc img.movable-img,#lib .movable-img,#cmpRightR .movable-img,.win-right .movable-img{cursor:move}
#doc img.movable-img.selected,#lib .movable-img.selected,#cmpRightR .movable-img.selected{outline:2px solid #4f8cff;outline-offset:1px}
.img-handle{position:fixed;width:12px;height:12px;background:#fff;border:2px solid #4f8cff;border-radius:50%;z-index:998;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.img-rotate{position:fixed;width:16px;height:16px;background:#ffb454;border:2px solid #fff;border-radius:50%;z-index:998;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:grab}
.img-tools{position:fixed;z-index:998;display:flex;gap:4px;background:#1f2937;border-radius:8px;padding:4px 6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.img-tools button{background:#374151;color:#fff;border:none;border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer}
.saveQ{margin-left:auto;font-size:13px;color:#333;display:flex;align-items:center;gap:5px;white-space:nowrap;background:#f0f4fa;border:1px solid #cfd8e6;border-radius:8px;padding:3px 10px;cursor:pointer;user-select:none}
.saveQ input{accent-color:var(--accent)}
#doc .sim-add,#doc .sim .sim-add{display:inline-block;margin-left:8px;font-size:16px !important;line-height:1.6 !important;padding:4px 10px;cursor:pointer;border-radius:6px;border:1px solid #bbb;background:#f0f4fa;color:#333;vertical-align:middle}
#lib{flex:1;display:none;flex-direction:column;min-height:0;background:#14151b}
#libScroll{flex:1;overflow-y:auto}
#libBody{padding:28px 40px}
.lsub{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;color:#fff;font-size:18px;font-weight:700}
.litem{display:flex;align-items:center;gap:10px;background:#1e2330;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:14px}
.litem .tag{background:#2c384b;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--accent2);white-space:nowrap}
.litem .q{flex:1;color:#dde3ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem button{flex:none;padding:4px 10px;font-size:12px}
.libview .libq,.libq{border:1px solid var(--border);border-radius:12px;margin:16px 0;background:#191d28;overflow:hidden}
.libview .libq-head,.libq .libq-head{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#222838;color:#cfe1ff;font-size:13px;font-weight:700;flex-wrap:wrap}
.libview .libq-head .dirty,.libq .libq-head .dirty{color:#ffb454;font-size:11px;display:none}
.libview .libq-head button,.libq .libq-head button{padding:3px 10px;font-size:12px}
.libview .libq-body,.libq-body{background:#fff;color:#222;font-size:17px;line-height:1.9;padding:14px 18px;border-radius:0 0 10px 10px}
.libview .libq-body h2,.libq-body h2{color:#333;border-left:5px solid #cc0000;padding-left:10px;margin:10px 0}
.libview .libq-body .answer,.libq-body .answer{color:#cc0000;font-weight:bold}
.libview .libq-body .solution,.libview .libq-body .know,.libview .libq-body .sim,.libq-body .solution,.libq-body .know,.libq-body .sim{background:#f5f5f5;border:1.5px solid #999;border-radius:8px;padding:12px;margin:8px 0}
.libview .libq-body .know,.libq-body .know{background:#E3F2FD;border-color:#2196F3}
.libview .libq-body .sim,.libq-body .sim{background:#E8F5E9;border-color:#4CAF50}
.libview .libq-body table,.libq-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
.libview .libq-body th,.libq-body th{background:#FFF3CD;border:1px solid #bbb;padding:6px}
.libview .libq-body td,.libq-body td{border:1px solid #bbb;padding:6px;vertical-align:top}
.libview .libq-body img,.libq-body img{max-width:100%}
details.lsub-box{background:#1e2330;border:1px solid var(--border);border-radius:10px;margin:10px 0;padding:8px 12px}
details.lsub-box>summary{cursor:pointer;color:#fff;font-size:15px;font-weight:700;padding:4px 0}
details.lsub-box details>summary{cursor:pointer;color:#8fd0ff;font-size:14px;font-weight:700;padding:4px 0}
details.lsub-box details .litem{margin:6px 0 6px 18px}
.win{position:fixed;right:12px;width:472px;max-height:82vh;background:#fff;color:#222;border:2px solid var(--accent);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:999;display:flex;flex-direction:column;resize:none;overflow:visible;min-width:300px;min-height:200px}
.win-resize{position:absolute;width:14px;height:14px;background:#4f8cff;border:2px solid #fff;border-radius:50%;z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.win-resize.nw{left:-7px;top:-7px;cursor:nwse-resize}
.win-resize.ne{right:-7px;top:-7px;cursor:nesw-resize}
.win-resize.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.win-resize.se{right:-7px;bottom:-7px;cursor:nwse-resize}
/* ═══════ 手機＋平板：相似題型視窗固定大小（桌機仍可縮放） ═══════ */
@media (max-width:1180px){
  .win{
    width:94vw !important;
    max-height:80vh !important;
    min-width:94vw !important;
    min-height:300px !important;
    right:3vw !important;
    left:3vw !important;
  }
  .win-resize{display:none !important}
}
.win-head{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1f2937;color:#fff;border-radius:10px 10px 0 0;cursor:move;font-size:13px;font-weight:700;flex:none;flex-wrap:wrap}
.win-head button{padding:2px 8px;font-size:12px}
/* ═══════ 手機版：相似題型視窗 觸控移動/縮放 ═══════ */
.win-head,.win-resize{
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.win-tools{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#f0f4fa;border-bottom:1px solid #d9dee8;position:relative;z-index:30}
.win-tools .tool{font-size:11px;padding:3px 7px}
.win-body{overflow-y:auto;padding:12px 14px;font-size:15px;line-height:1.8;flex:1;min-height:0}
.win-body h2{color:#333;border-left:5px solid #cc0000;padding-left:10px;margin:8px 0}
.win-body .answer{color:#cc0000;font-weight:bold}
.win-body .solution,.win-body .know,.win-body .sim{background:#f5f5f5;border:1.5px solid #999;border-radius:8px;padding:12px;margin:8px 0}
.win-body .know{background:#E3F2FD;border-color:#2196F3}
.win-body .sim{background:#E8F5E9;border-color:#4CAF50}
.win-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
.win-body th{background:#FFF3CD;border:1px solid #bbb;padding:6px}
.win-body td{border:1px solid #bbb;padding:6px;vertical-align:top}
.win-body img{max-width:100%}
.win-cols{display:flex;min-height:320px;border:1px solid #d9dee8;border-radius:8px;overflow:hidden}
.win-cols>div{flex:1;min-width:0;overflow-y:auto;padding:10px 12px;font-size:15px;line-height:1.8}
.win-left{border-right:1px solid #d9dee8;background:#fff}
.win-right{background:#fbfdff}
.win-side-heads{flex:none;display:flex;border-bottom:1px solid #d9dee8;background:#eef3fb;position:relative;z-index:30}
.win-side-heads .win-side-label{flex:1;font-weight:700;padding:6px 10px;font-size:13px;color:#1f2937;text-align:center;border-right:1px solid #d9dee8}
.win-side-heads .win-side-label:last-child{border-right:none}
.win-right-body{padding:10px 12px}
#compareView{position:fixed;inset:0;z-index:1000;background:#14151b;display:none;flex-direction:column}
#compareView .cv-head{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#1f2937;color:#fff;font-weight:700;flex:none;flex-wrap:wrap}
#compareView .cv-head button{padding:4px 12px}
#compareView #cmpTools{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:#181a22;border-bottom:1px solid var(--border);position:relative;z-index:30}
#compareView .cv-cols{flex:1;display:flex;min-height:0}
#compareView .cv-pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
#compareView .cv-pane .cv-title{flex:none;padding:6px 12px;background:#222838;color:#cfe1ff;font-size:13px;font-weight:700;position:relative;z-index:30}
#compareView .cv-doc{flex:1;overflow-y:auto;background:#fff;padding:12px 16px;font-size:16px;line-height:1.85;color:#222}
#compareView .cv-doc h1{color:#333;border-bottom:3px solid #999;padding-bottom:8px}
#compareView .cv-doc h2{color:#333;border-left:5px solid #cc0000;padding-left:10px;margin:20px 0 10px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#compareView .cv-doc .answer{color:#cc0000;font-weight:bold}
#compareView .cv-doc .solution,#compareView .cv-doc .know,#compareView .cv-doc .sim{background:#f5f5f5;border:1.5px solid #999;border-radius:8px;padding:12px;margin:8px 0}
#compareView .cv-doc .know{background:#E3F2FD;border-color:#2196F3}
#compareView .cv-doc .sim{background:#E8F5E9;border-color:#4CAF50}
#compareView .cv-doc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
#compareView .cv-doc th{background:#FFF3CD;border:1px solid #bbb;padding:6px}
#compareView .cv-doc td{border:1px solid #bbb;padding:6px;vertical-align:top}
#compareView .cv-doc img{max-width:100%}
#qnavToggle{margin-left:auto;font-size:14px;padding:6px 10px;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#qnavPanel{position:absolute;right:8px;top:calc(100% + 4px);display:none;background:#fff;border:2px solid #4f8cff;border-radius:10px;max-height:60vh;overflow-y:auto;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);width:170px;z-index:50}
#qnavPanel .qnav-title{font-size:12px;color:#333;font-weight:700;text-align:center;margin-bottom:4px}
#qnavGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;text-align:center}
#qnavGrid button{font-size:12px;padding:3px 0;width:100%}
#qnavGrid button.on{background:#4f8cff;border-color:#4f8cff;color:#fff}
#qnavGrid button.wrong{background:#e11d48;border-color:#e11d48;color:#fff}
/* ═══════ 全螢幕：題號面板浮動顯示 ═══════ */
#qnavPanel.fs-panel{
  position:fixed !important;
  top:66px !important;
  left:12px !important;
  right:auto !important;
  width:200px !important;
  max-height:70vh !important;
  z-index:9999 !important;
}
#exam{flex:1;display:none;flex-direction:column;min-height:0;background:#14151b}
#examScroll{flex:1;overflow-y:auto}
#examBody{padding:28px 40px}
.exam-radio{display:block;margin:8px 0;cursor:pointer;font-size:16px;line-height:1.8}
.exam-radio input{margin-right:8px;accent-color:#4f8cff}
.exam-head{background:#1e2330;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 16px;color:#cfe1ff;font-size:14px}
.exam-wrong{background:#ffe5e5;border:1px solid #e11d48;border-radius:8px;padding:10px;margin:10px 0;color:#8a0f22;font-size:15px}
/* ═══════ 平板（≥1024px）單欄主題 ═══════ */
@media (min-width:1024px){
  #docSide{display:none !important}
  #doc{flex:1;min-width:0;max-width:1000px}
}
/* ═══════ 題目/選項：不可編輯、A~D 分行、可螢光筆 ═══════ */
#doc h2[contenteditable="false"],
.libq-body h2[contenteditable="false"],
.win-body h2[contenteditable="false"],
#cmpRightR h2[contenteditable="false"]{
  user-select:text;
  cursor:text;
}
.options.exam-style,
.libq-body .options.exam-style,
.win-body .options.exam-style,
#compareView .options.exam-style{
  user-select:text;
  cursor:text;
}
.options.exam-style .exam-opt{
  display:block;
  margin:6px 0;
  line-height:1.8;
  font-size:16px;
  user-select:text;
}
.options.exam-style .exam-opt.is-ans{
  background:#fff3cd;
  border-radius:4px;
  font-weight:700;
}
/* ═══════ 手機（<768px）觸控優化 ═══════ */
@media (max-width:767px){
  html{font-size:15px}
  header{padding:6px 8px}
  header h1{font-size:15px}
  header button{font-size:13px;padding:8px 12px;border-radius:10px}
  .tool{font-size:13px;padding:6px 10px;border-radius:8px}
  #viewTop,#libTools{flex-wrap:wrap;gap:6px;padding:6px 8px}
  #viewTop button,#viewTop .tool,#libTools button,#libTools .tool{font-size:13px;padding:6px 10px}
  #doc{font-size:18px;line-height:1.9}
  #doc p,#doc .options{font-size:17px}
  #doc h2{font-size:18px}
  #doc .answer{font-size:17px}
  #doc .solution,#doc .know,#doc .sim{font-size:16px;padding:12px}
  #doc table{font-size:14px}
  #doc td,#doc th{font-size:14px;padding:6px}
  #qnavToggle{font-size:16px;padding:8px 14px;border-radius:24px}
  #qnavPanel{width:200px}
  #qnavGrid{grid-template-columns:repeat(6,1fr)}
  #qnavGrid button{font-size:15px;padding:8px 0}
  input[type=color]{width:32px;height:28px}
  .hl-btn{width:24px;height:22px;border-radius:6px}
  .saveQ{font-size:12px;padding:4px 8px}
  .img-tools button{font-size:13px;padding:4px 10px}
  #floatFs{position:fixed;right:12px;bottom:16px;z-index:998;width:46px;height:46px;border-radius:50%;background:rgba(79,140,255,.9);color:#fff;font-size:20px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
  #toast{font-size:14px;padding:10px 14px}
/* ═══════ 手機版全螢幕閱讀 ═══════ */
body.fs-mode header{display:none !important}
body.fs-mode #viewTop,body.fs-mode #libTools{display:none !important}
body.fs-mode #docWrap,body.fs-mode #libScroll{height:100vh !important}
#fsExit{position:fixed;right:10px;bottom:14px;z-index:9999;background:rgba(31,41,55,.82);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:10px 16px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
}
/* ═══════ 手機/平板：圖片觸控優化 ═══════ */
.movable-img.selected{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.img-handle,.img-rotate{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.img-tools{
  z-index:1001 !important;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.img-tools button{
  min-width:46px;
  min-height:42px;
  font-size:15px !important;
}
/* ═══════ 電腦/平板：隱藏全螢幕相關按鈕（只留手機用） ═══════ */
@media (min-width:768px){
  #floatFs{display:none !important}
  #fsQnavBtn{display:none !important}
  #fsExit{display:none !important}
  #fsBtnView,#fsBtnLib{display:none !important}
}

/* ═══════ 手機版專屬（打包時自動加入） ═══════ */
@media (max-width:767px){
  #docSide{display:none !important}
  #viewTop,#libTools{padding:6px 8px;gap:6px}
  #viewTop button,#viewTop .tool,#libTools button,#libTools .tool{font-size:13px !important;padding:6px 10px !important;border-radius:8px !important}

<!-- ═══════ 🔑 金鑰鎖（手機版/瀏覽器：只用 localStorage；電腦版：才查後端） ═══════ -->
<script src="index.js"></script><script>
/* ═══════ 🔑 金鑰鎖（支援多組金鑰） ═══════ */
const ACCESS_CODES=[
  'KEY-0001',
  'KEY-0002',
  'KEY-0003',
  'KEY-0004',
  'KEY-0005',
  'KEY-0006',
  'KEY-0007',
  'KEY-0008',
  'KEY-0009',
  'KEY-0010'
];
(function(){
  /* 判斷是否「有後端」（http://127.0.0.1 等） */
  var hasBackend=false;
  try{
    if(location.protocol==='http:'||location.protocol==='https:'){
      var x=new XMLHttpRequest();
      x.open('GET','/api/is_unlocked',false);
      x.send();
      if(x.status===200){
        var j=JSON.parse(x.responseText);
        if(j&&j.ok)return;
        hasBackend=true;
      }
    }
  }catch(e){}
  /* 手機版/瀏覽器（file://）：只讀 localStorage */
  if(!hasBackend&&localStorage.getItem('unlocked')==='1')return;
  var div=document.createElement('div');
  div.id='keyLock';
  div.style.cssText='position:fixed;inset:0;background:#14151b;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff';
  div.innerHTML=
    '<div style="font-size:26px">🔑</div>'+
    '<div style="font-size:18px;font-weight:700">請輸入金鑰</div>'+
    '<div style="font-size:13px;color:#9aa0b0">裝置首次使用需輸入（換裝置、清除瀏覽資料後需再輸入）</div>'+
    '<input id="keyInput" type="password" placeholder="輸入金鑰" style="padding:10px 14px;border-radius:8px;border:1px solid #4f8cff;font-size:16px;text-align:center;width:220px;background:#1a1b22;color:#fff">'+
    '<button id="keyBtn" style="padding:10px 30px;border-radius:8px;border:none;background:#4f8cff;color:#fff;font-size:15px;font-weight:700;cursor:pointer">解鎖</button>'+
    '<div id="keyMsg" style="font-size:12px;color:#e11d48;min-height:16px"></div>';
  document.body.appendChild(div);
  function tryUnlock(){
    var input=document.getElementById('keyInput').value;
    if(ACCESS_CODES.indexOf(input)>=0){
      localStorage.setItem('unlocked','1');
      try{sessionStorage.setItem('justUnlocked','1');}catch(e){}
      if(hasBackend){
        try{
          var xhr2=new XMLHttpRequest();
          xhr2.open('GET','/api/set_unlocked',false);
          xhr2.send();
          var xhr3=new XMLHttpRequest();
          xhr3.open('POST','/api/unlock_done',false);
          xhr3.setRequestHeader('Content-Type','application/json');
          xhr3.send('{}');
        }catch(e2){}
      }
      div.remove();
      /* 解鎖後重新載入頁面，確保卡片/版面正常 */
      location.reload();
    }else{
      document.getElementById('keyMsg').textContent='❌ 金鑰錯誤';
    }
  }
  document.getElementById('keyBtn').onclick=tryUnlock;
  document.getElementById('keyInput').addEventListener('keydown',function(e){
    if(e.key==='Enter')tryUnlock();
  });
  document.getElementById('keyInput').focus();
})();
</script>
<script>
'use strict';

/* ═══════ 手機版：IndexedDB 儲存層 ═══════ */
const DB_NAME='radiographer_exam_helper';
const DB_VER=1;
let _db=null;
function idbOpen(){
  return new Promise(function(resolve,reject){
    if(_db){resolve(_db);return;}
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
    };
    req.onsuccess=function(e){_db=e.target.result;resolve(_db);};
    req.onerror=function(e){reject(e.target.error||new Error('IndexedDB 開啟失敗'));};
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise(function(resolve,reject){
    const r=db.transaction('kv','readonly').objectStore('kv').get(key);
    r.onsuccess=function(){resolve(r.result);};
    r.onerror=function(){reject(r.error);};
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise(function(resolve,reject){
    const t=db.transaction('kv','readwrite');
    t.objectStore('kv').put(val,key);
    t.oncomplete=function(){resolve(true);};
    t.onerror=function(){reject(t.error);};
  });
}
async function idbDel(key){
  const db=await idbOpen();
  return new Promise(function(resolve,reject){
    const t=db.transaction('kv','readwrite');
    t.objectStore('kv').delete(key);
    t.oncomplete=function(){resolve(true);};
    t.onerror=function(){reject(t.error);};
  });
}
async function idbKeys(prefix){
  const db=await idbOpen();
  return new Promise(function(resolve,reject){
    const r=db.transaction('kv','readonly').objectStore('kv').getAllKeys();
    r.onsuccess=function(){resolve((r.result||[]).filter(function(k){return String(k).indexOf(prefix)===0;}));};
    r.onerror=function(){reject(r.error);};
  });
}
async function scanExamsFromIdb(){
  const ks=await idbKeys('exam:');
  const result={subjects:[]};
  for(const k of ks){
    const rel=k.slice(5);const parts=rel.split('/');
    if(parts.length<3)continue;
    const sub=parts[0],lab=parts[1],name=parts.slice(2).join('/');
    let s=result.subjects.find(function(x){return x.name===sub;});
    if(!s){s={name:sub,labels:[]};result.subjects.push(s);}
    let l=s.labels.find(function(x){return x.label===lab;});
    if(!l){l={label:lab,attempts:[]};s.labels.push(l);}
    const data=await idbGet(k)||{};
    l.attempts.push({name:name,time:data.time||'',score:data.score,total:data.total||0,
                     correct:data.correct||0,wrong_count:(data.wrong||[]).length,
                     draft:data.draft||false,file:data.file||''});
  }
  result.subjects.forEach(function(s){s.labels.sort(function(a,b){return a.label.localeCompare(b.label);});});
  return result;
}
/* ═══════ 手機版前端 API（單檔/多檔都支援） ═══════ */
async function api(path,body){
  if(path==='/api/index'){
    if(window.MOBILE_INDEX)return {ok:true,data:window.MOBILE_INDEX};
    if(window.MOBILE_DATA&&window.MOBILE_DATA.index)return {ok:true,data:window.MOBILE_DATA.index};
    return {ok:false,msg:'資料未載入(index.js)'};
  }
  if(path==='/api/round'){
    const f=await loadRound(body.file);
    return f?{ok:true,html:f}:{ok:false,msg:'找不到檔案'};
  }
  if(path==='/api/question'){
    const html=await loadRound(body.file);
    if(!html)return {ok:false,msg:'找不到題目'};
    const num=parseInt(body.num)||0;
    const m=html.match(new RegExp('<h2[^>]*>\\s*第\\s*'+num+'\\s*[題题]','i'));
    if(!m)return {ok:false,msg:'找不到題目'};
    let frag=html.slice(m.index);
    const rest=frag.slice(6);
    const nm=rest.match(/<h2[^>]*>\s*第\s*\d{1,3}\s*[題题]/i);
    if(nm)frag=frag.slice(0,nm.index+6);
    return {ok:true,html:frag};
  }
  if(path==='/api/notes'){
    const v=await idbGet('note:'+body.key);
    return {ok:true,data:v||{}};
  }
  if(path==='/api/save_notes'){
    await idbSet('note:'+body.key,body.data||{});
    return {ok:true};
  }
  if(path==='/api/delete_note'){
    await idbDel('note:'+body.key);
    return {ok:true};
  }
  if(path==='/api/list_notes'){
    const ks=await idbKeys('note:');
    return {ok:true,files:ks.map(function(k){return k.slice(5);})};
  }
  if(path==='/api/save_image'){
    return {ok:true};
  }
  if(path==='/api/library'){
    const v=await idbGet('lib:試題庫');
    return {ok:true,data:v||{subjects:[]}};
  }
  if(path==='/api/save_library'){
    await idbSet('lib:試題庫',body.data||{subjects:[]});
    return {ok:true};
  }
  if(path==='/api/save_paper'){
    await idbSet('paper:'+body.key,body.html||'');
    return {ok:true};
  }
  if(path==='/api/list_papers'){
    const ks=await idbKeys('paper:');
    return {ok:true,files:ks.map(function(k){return k.slice(6);})};
  }
  if(path==='/api/delete_paper'){
    await idbDel('paper:'+body.name);
    return {ok:true};
  }
  if(path==='/api/paper'){
    const v=await idbGet('paper:'+body.name);
    return v?{ok:true,html:v}:{ok:false,msg:'找不到'};
  }
  if(path==='/api/exam_save'){
    await idbSet('exam:'+body.key,body.data||{});
    return {ok:true};
  }
  if(path==='/api/exam_load'){
    const v=await idbGet('exam:'+body.key);
    return v?{ok:true,data:v}:{ok:false,msg:'找不到'};
  }
  if(path==='/api/exam_delete'){
    await idbDel('exam:'+body.key);
    return {ok:true};
  }
  if(path==='/api/exams'){
    return {ok:true,data:await scanExamsFromIdb()};
  }
  if(path==='/api/export_backup'){
    const ks=await idbKeys('');
    const data={};
    for(const k of ks){data[k]=await idbGet(k);}
    return {ok:true,data:data};
  }
  if(path==='/api/import_backup'){
    const inp=body.data||{};
    let count=0;
    for(const k in inp){if(typeof k==='string'){await idbSet(k,inp[k]);count++;}}
    return {ok:true,count:count};
  }
  return {ok:false,msg:'unknown(手機版)'};
}
/* ═══════ 分批載入：檔案快取 ═══════ */
const _roundCache={};
async function loadRound(file){
  if(_roundCache[file]!==undefined)return _roundCache[file];
  if(window.MOBILE_DATA&&window.MOBILE_DATA.files&&window.MOBILE_DATA.files[file]!==undefined){
    _roundCache[file]=window.MOBILE_DATA.files[file];
    return _roundCache[file];
  }
  const sub=String(file).split('/')[0];
  const name=(window.MOBILE_SUBS&&window.MOBILE_SUBS[sub])||('sub_'+encodeURIComponent(sub)+'.js');
  try{
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok)return null;
    const txt=await r.text();
    const m=txt.match(/window\.MOBILE_SUB\s*=\s*(\{[\s\S]*\});?\s*$/);
    if(!m)return null;
    const data=JSON.parse(m[1]);
    if(data&&data.files){
      for(const k in data.files){_roundCache[k]=data.files[k];}
    }
    return _roundCache[file]||null;
  }catch(e){return null;}
}

let cmpHlDirect=false,cmpEraser=false;

function isEmptyCell(el){
  if(!el) return true;
  const txt=(el.textContent||'').replace(/\s+/g,'');
  if(txt!=='') return false;
  if(el.querySelector('img,canvas,svg,input,select,textarea,hr,picture,video')) return false;
  if(el.querySelectorAll('br').length>1) return false;
  return true;
}
function cleanupEmptyTableParts(root){
  const scope=root||docEl;
  scope.querySelectorAll('table').forEach(t=>{
    let changed=true;
    while(changed){
      changed=false;
      Array.from(t.querySelectorAll('tr')).forEach(tr=>{
        const cells=Array.from(tr.querySelectorAll('td,th'));
        if(!cells.length){
          tr.remove();
          changed=true;
          return;
        }
        if(cells.every(isEmptyCell)){
          tr.remove();
          changed=true;
        }
      });
      const rows=Array.from(t.querySelectorAll('tr'));
      const maxCols=rows.reduce((mx,tr)=>Math.max(mx,tr.children.length),0);
      for(let ci=0;ci<maxCols;ci++){
        const colCells=[];
        rows.forEach(tr=>{
          const c=Array.from(tr.children).filter(el=>el.matches('td,th'));
          if(c[ci]) colCells.push(c[ci]);
        });
        if(colCells.length&&colCells.every(isEmptyCell)){
          colCells.forEach(c=>c.remove());
          changed=true;
        }
      }
    }
    t.querySelectorAll('tbody').forEach(tb=>{
      if(!tb.querySelector('tr')) tb.remove();
    });
    if(!t.querySelector('tr')) t.remove();
  });
}

/* ═══════ 所有地方「題目+選項」轉成考題格式（A~D 分行、無圓點、不可改字、可螢光筆） ═══════ */
function convertDocToExamStyle(root){
  const scope=root||docEl;
  scope.querySelectorAll('h2').forEach(function(h){
    h.setAttribute('contenteditable','false');
    h.style.userSelect='text';
    let sib=h.nextSibling;
    while(sib&&!(sib.nodeType===1&&sib.tagName==='H2')){
      if(sib.nodeType===1&&sib.classList&&sib.classList.contains('options')){
        const raw=sib.textContent||'';
        const segs=raw.split(/(?=[A-D][.、])/).map(x=>x.trim()).filter(Boolean);
        const wrap=document.createElement('div');
        wrap.className='options exam-style';
        wrap.setAttribute('contenteditable','false');
        segs.forEach(function(seg){
          const om=seg.match(/^([A-D])[.、]\s*(.+)$/);
          if(om){
            const opt=document.createElement('div');
            opt.className='exam-opt';
            opt.textContent=om[1]+'. '+om[2];
            wrap.appendChild(opt);
          }
        });
        sib.replaceWith(wrap);
        break;
      }
      sib=sib.nextSibling;
    }
  });
}
/* ═══════ 清除多餘空白 span（含題目區 exam-opt） ═══════ */
function cleanupEmptySpans(root){
  const scope=root||docEl;
  if(!scope)return;
  /* ① 移除完全空的 span */
  scope.querySelectorAll('span').forEach(function(s){
    if(!s.textContent.trim()&&!s.querySelector('img,br'))s.remove();
  });
  /* ② 移除 span 前後多餘的空白文字節點 */
  scope.querySelectorAll('span').forEach(function(s){
    let n=s.previousSibling;
    while(n&&n.nodeType===3&&!n.nodeValue.trim()){
      n.parentNode.removeChild(n);
      n=s.previousSibling;
    }
    n=s.nextSibling;
    while(n&&n.nodeType===3&&!n.nodeValue.trim()){
      n.parentNode.removeChild(n);
      n=s.nextSibling;
    }
  });
  /* ③ 合併相鄰、同字體大小的 span */
  scope.querySelectorAll('span').forEach(function(s){
    let n=s.nextSibling;
    while(n&&n.nodeType===3&&!n.nodeValue.trim()){
      n.remove();
      n=s.nextSibling;
    }
    if(n&&n.nodeType===1&&n.tagName==='SPAN'&&n.style.fontSize===s.style.fontSize){
      s.appendChild(document.createTextNode(n.textContent));
      n.remove();
    }
  });
  /* ④ 特別清理題目區（.exam-opt / .options.exam-style）內多餘空元素 */
  scope.querySelectorAll('.exam-opt span,.exam-opt div,.options.exam-style span').forEach(function(el){
    if(!el.textContent.trim()&&!el.querySelector('img,br'))el.remove();
  });
  /* ⑤ 清掉題目區內殘留的空白文字節點（跨選項被拆開時常見） */
  scope.querySelectorAll('.exam-opt').forEach(function(opt){
    [...opt.childNodes].forEach(function(n){
      if(n.nodeType===3&&!n.nodeValue.trim())n.parentNode.removeChild(n);
    });
  });
}
/* ═══════ 精準改「選取範圍」文字大小（只改選到的部分，不整行、可連續、無空格） ═══════ */
function fontSel(container,delta){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed)return null;
  const range=sel.getRangeAt(0);
  const inside=function(n){
    if(!n)return false;
    if(n.nodeType===3)n=n.parentElement;
    return n&&container&&(container===n||container.contains(n));
  };
  if(!inside(range.startContainer)||!inside(range.endContainer))return null;

  /* ① 確認有文字 */
  const clone=range.cloneContents();
  if(!(clone.textContent||'').trim())return null;

  /* ② 取基準字體（選取起始處的父層） */
  let base=17;
  const sc=range.startContainer;
  const pEl=sc&&sc.parentElement?sc.parentElement:container;
  base=parseFloat(getComputedStyle(pEl).fontSize)||17;
  const next=Math.max(10,Math.min(48,base+delta));

  /* ③ 只抽出「選取範圍」的文字（未選到的前後完全不動） */
  const extracted=range.extractContents();
  const sp=document.createElement('span');
  sp.style.fontSize=next+'px';
  sp.appendChild(extracted);
  range.insertNode(sp);

  /* ④ 重新選取 → 可連續按 A+/A- */
  sel.removeAllRanges();
  try{
    const r=document.createRange();
    r.selectNodeContents(sp);
    sel.addRange(r);
  }catch(e){}

  /* ⑤ 清掉可能的多餘空白 span */
  try{cleanupEmptySpans(container);}catch(e){}

  return {size:next};
}
function getCurrentQuestionNum(){
  const scroll=docWrap.scrollTop;
  let target=null;
  docEl.querySelectorAll('h2').forEach(h=>{
    const m=h.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
    if(!m)return;
    const pos=h.getBoundingClientRect().top+docWrap.scrollTop;
    if(pos+80>=scroll){
      if(target===null||pos<target._pos){
        target=h;
        target._pos=pos;
      }
    }
  });
  if(!target)return 0;
  const m=target.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
  return m?parseInt(m[1]):0;
}

function buildQnav(){
  const nums=[];
  docEl.querySelectorAll('h2').forEach(h=>{
    const m=h.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
    if(m) nums.push(parseInt(m[1]));
  });
  if(!nums.length){hideQnav();return;}
  const grid=$('qnavGrid');
  grid.innerHTML='';
  nums.forEach(n=>{
    const b=document.createElement('button');
    b.className='tool';
    b.textContent=n;
    if(examWrong.has(n))b.classList.add('wrong');
    b.onclick=function(){
      const target=findQHeading(n);
      if(target){
        try{target.scrollIntoView({behavior:'smooth',block:'start'});}
        catch(e){target.scrollIntoView();}
      }
      $('qnavPanel').style.display='none';
    };
    grid.appendChild(b);
  });
  showQnav();
}
function findQHeading(num){
  const re=new RegExp('第\\s*'+num+'\\s*[題题]');
  let found=null;
  docEl.querySelectorAll('h2').forEach(h=>{
    if(re.test(h.textContent))found=h;
  });
  return found;
}

  const sub=data.subjects.find(s=>s.name===subject);

function scrollToQuestion(container,num){

  const re=new RegExp('第\\s*'+num+'\\s*[題题]');

    if(re.test(h.textContent))target=h;
  });

    catch(e){container.parentElement.scrollTop=target.offsetTop;}
  }else{container.parentElement.scrollTop=0;}
}

function applyHlToSelection(color){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed)return false;
  if(!editMode){showToast('請先點擊「✏️ 編輯文字」再使用螢光筆');return false;}
  noteSnapNow();
  docEl.focus();
  try{
    const range=sel.getRangeAt(0);
    const frag=range.cloneContents();
    if(!(frag.textContent||'').trim()&&!frag.querySelector('img'))return false;
    const extracted=range.extractContents();
    const sp=document.createElement('span');
    sp.style.backgroundColor=color||hlColor;
    sp.appendChild(extracted);
    range.insertNode(sp);
    sel.removeAllRanges();
    try{
      const nr=document.createRange();
      nr.selectNodeContents(sp);
      sel.addRange(nr);
    }catch(e){}
    try{cleanupEmptySpans(docEl);}catch(e){}
    scheduleAutoSave();
    showToast('🖊️ 已標記');
    return true;
  }catch(e){
    showToast('標記失敗');
    return false;
  }
}

function insertAtViewportCenter(img){
  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  let el=document.elementFromPoint(cx,cy);
  while(el&&el!==docEl&&!docEl.contains(el))el=el.parentElement;
  if(el&&docEl.contains(el)){
    if(el===docEl)docEl.appendChild(img);
    else el.parentNode.insertBefore(img,el.nextSibling);
  }
  else docEl.appendChild(img);
  /* 以 docWrap 為定位基準 → 絕對定位（浮動不擠文字），
     並加上目前捲動距離 → 圖片插在「目前畫面中央」而非第一頁 */
  const wrapRect=docWrap.getBoundingClientRect();
  const r=img.getBoundingClientRect();
  const scrollLeft=docWrap.scrollLeft||0;
  const scrollTop=docWrap.scrollTop||0;
  img.style.position='absolute';
  img.style.zIndex='50';
  img.style.left=(cx-wrapRect.left-(r.width/2))+scrollLeft+'px';
  img.style.top=(cy-wrapRect.top-(r.height/2))+scrollTop+'px';
}
function clearImgUI(){
  document.querySelectorAll('.img-handle,.img-rotate,.img-tools').forEach(el=>el.remove());
  selHandles=[];
  rotHandle=null;
  imgToolbar=null;
  if(selImg){
    selImg.classList.remove('selected');
    selImg=null;
  }
}
function imgCenter(img){
  const r=img.getBoundingClientRect();
  return{cx:r.left+r.width/2,cy:r.top+r.height/2};
}
function updateImgUI(){
  if(!selImg)return;
  const r=selImg.getBoundingClientRect();
  selHandles.forEach(h=>{
    let x=0,y=0;
    switch(h.dataset.pos){
      case'nw':x=r.left-6;y=r.top-6;break;
      case'ne':x=r.right-6;y=r.top-6;break;
      case'sw':x=r.left-6;y=r.bottom-6;break;
      case'se':x=r.right-6;y=r.bottom-6;break;
    }
    h.style.left=x+'px';
    h.style.top=y+'px';
  });
  if(rotHandle){
    rotHandle.style.left=(r.left+r.width/2-8)+'px';
    rotHandle.style.top=(r.top-24)+'px';
  }
  if(imgToolbar){
    imgToolbar.style.left=r.left+'px';
    imgToolbar.style.top=Math.max(4,r.top-40)+'px';
  }
}
function selectImg(img){
  clearImgUI();
  selImg=img;
  img.classList.add('selected');
  const defs=[{pos:'nw',cur:'nwse-resize'},{pos:'ne',cur:'nesw-resize'},{pos:'sw',cur:'nesw-resize'},{pos:'se',cur:'nwse-resize'}];
  selHandles=defs.map(d=>{
    const h=document.createElement('div');
    h.className='img-handle';
    h.dataset.pos=d.pos;
    h.style.cursor=d.cur;
    h.addEventListener('mousedown',ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      startImgResize(ev,h);
    });
    document.body.appendChild(h);
    return h;
  });
  rotHandle=document.createElement('div');
  rotHandle.className='img-rotate';
  rotHandle.title='拖曳旋轉';
  rotHandle.addEventListener('mousedown',ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    noteSnapNow();
    const c=imgCenter(img);
    const baseRot=parseFloat(img.dataset.rot||'0');
    const rotStart=Math.atan2(ev.clientY-c.cy,ev.clientX-c.cx)*180/Math.PI;
    const mv=e2=>{
      const now=Math.atan2(e2.clientY-c.cy,e2.clientX-c.cx)*180/Math.PI;
      let rot=baseRot+(now-rotStart)%360;
      img.dataset.rot=String(rot);
      img.style.transform='rotate('+rot+'deg)';
    };
    const up=()=>{
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
      scheduleAutoSave();
      showToast('↻ 已旋轉圖片');
    };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
  document.body.appendChild(rotHandle);
  imgToolbar=document.createElement('div');
  imgToolbar.className='img-tools';
  const bPanel=document.createElement('button');
  bPanel.textContent='⚙️ 調整';
  bPanel.onclick=e=>{
    e.stopPropagation();
    showImgPanel(img);
  };
  imgToolbar.appendChild(bPanel);
  const bRot=document.createElement('button');
  bRot.textContent='↻ +15°';
  bRot.onclick=e=>{
    e.stopPropagation();

function startImgResize(ev,handle){
  const img=selImg;
  if(!img)return;
  noteSnapNow();
  const rect=img.getBoundingClientRect();
  const sx=ev.clientX,sy=ev.clientY;
  const ow=rect.width,oh=rect.height;
  const nat=(img.naturalWidth&&img.naturalHeight)?img.naturalWidth/img.naturalHeight:(ow/oh||1);
  const pos=handle.dataset.pos;
  const onMove=e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    let nw=ow;
    if(pos.includes('e'))nw=ow+dx;
    if(pos.includes('w'))nw=ow-dx;
    if(pos.includes('s'))nw=Math.max(ow+(ow/oh)*dy,20);
    if(pos.includes('n'))nw=Math.max(ow-(ow/oh)*dy,20);
    img.style.position='absolute';
    img.style.width=Math.round(nw)+'px';
    img.style.height=Math.round(nw/nat)+'px';
    updateImgUI();
  };
  const onUp=()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    noteSnapNow();          /* ← 縮放後快照，復原/重做可用 */
    scheduleAutoSave();
    showToast('📐 圖片大小已調整');
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

window.__imgTouchHandled=false;
let __imgTouch={active:false,map:new Map(),start:null,pinchCx:null,pinchCy:null};
function __imgFrom(e){
  const t=e.target;
  if(!t||!t.closest)return null;
  return t.closest('img.movable-img');
}
docEl.addEventListener('pointerdown',function(e){
  if(e.pointerType!=='touch')return;
  if(e.target.closest&&e.target.closest('.img-tools'))return;
  const img=__imgFrom(e);
  if(!img)return;
  if(!editMode||hlDirect||eraserMode)return;
  e.preventDefault();
  window.__imgTouchHandled=true;
  __imgTouch.map.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!__imgTouch.active){
    __imgTouch.active=true;
    if(selImg!==img)selectImg(img);
    const r=img.getBoundingClientRect();
    __imgTouch.start={
      img:img,
      left:parseFloat(img.style.left)||0,
      top:parseFloat(img.style.top)||0,
      w:r.width||img.naturalWidth||300,
      h:r.height||img.naturalHeight||300,
      rot:parseFloat(img.dataset.rot||'0')||0,
      px:e.clientX,py:e.clientY,
      dist:0,angle:0
    };
    __imgTouch.pinchCx=null;
    __imgTouch.pinchCy=null;
  }
},{passive:false});
document.addEventListener('pointermove',function(e){
  if(e.pointerType!=='touch')return;
  if(!__imgTouch.active||!__imgTouch.start)return;
  __imgTouch.map.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=Array.from(__imgTouch.map.values());
  const s=__imgTouch.start;
  if(pts.length>=2){
    e.preventDefault();
    const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
    const dist=Math.hypot(dx,dy);
    const angle=Math.atan2(dy,dx)*180/Math.PI;
    if(!s.dist){s.dist=dist;s.angle=angle;return;}
    const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
    if(__imgTouch.pinchCx===null){__imgTouch.pinchCx=cx;__imgTouch.pinchCy=cy;}
    s.img.style.position='absolute';
    s.img.style.left=(s.left+(cx-__imgTouch.pinchCx))+'px';
    s.img.style.top=(s.top+(cy-__imgTouch.pinchCy))+'px';
    s.img.style.width=Math.max(40,s.w*(dist/(s.dist||1)))+'px';
    s.img.style.height=Math.max(30,s.h*(dist/(s.dist||1)))+'px';
    let rot=s.rot+(angle-s.angle);
    s.img.dataset.rot=String(((rot%360)+360)%360);
    s.img.style.transform='rotate('+rot+'deg)';
    updateImgUI();
  }else if(pts.length===1){
    const p=pts[0];
    s.img.style.position='absolute';
    s.img.style.left=(s.left+(p.x-s.px))+'px';
    s.img.style.top=(s.top+(p.y-s.py))+'px';
    updateImgUI();
    e.preventDefault();
  }
},{passive:false});
function __imgTouchEnd(e){
  if(e.pointerType!=='touch')return;
  __imgTouch.map.delete(e.pointerId);
  if(__imgTouch.map.size===0){
    if(__imgTouch.start){
      noteSnapNow();
      scheduleAutoSave();
      showToast('📌 圖片已調整（自動儲存）');
    }
    __imgTouch.active=false;
    __imgTouch.start=null;
    __imgTouch.pinchCx=null;
    __imgTouch.pinchCy=null;
  }
}

function linkifySimBox(box){
  if(!box)return;
  const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    const p=node.parentNode;
    if(p&&p.closest&&p.closest('a'))continue;
    nodes.push(node);
  }
  nodes.forEach(node=>{
    const t=node.nodeValue||'';
    const re=/(\d{3})\s*[-年/]?\s*(?:第\s*)?([1-9一二三四五六七八九十]|1[0-2])\s*(?:次|期)?\s*第\s*(\d{1,3})\s*[題题]/g;
    let last=0,mm,any=false;
    const frag=document.createDocumentFragment();
    while((mm=re.exec(t))!==null){
      any=true;
      frag.appendChild(document.createTextNode(t.slice(last,mm.index)));
      const span=makeSimSpan(mm[0]);
      frag.appendChild(span);
      last=re.lastIndex;
    }
    if(any){
      frag.appendChild(document.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag,node);
    }
  });
}

function addWinResize(w){
  ['nw','ne','sw','se'].forEach(pos=>{
    const h=document.createElement('div');
    h.className='win-resize '+pos;
    h.addEventListener('pointerdown',e=>{
      e.preventDefault();
      e.stopPropagation();
      const r=w.getBoundingClientRect();
      const sx=e.clientX,sy=e.clientY;
      const sw=r.width,sh=r.height,sl=r.left,st=r.top;
      const move=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        let left=sl,top=st,width=sw,height=sh;
        if(pos.includes('w')){width=sw-dx;left=sl+dx;}
        if(pos.includes('e')){width=sw+dx;}
        if(pos.includes('n')){height=sh-dy;top=st+dy;}
        if(pos.includes('s')){height=sh+dy;}
        width=Math.max(300,width);
        height=Math.max(200,height);
        w.style.width=width+'px';
        w.style.height=height+'px';
        if(pos.includes('w'))w.style.left=left+'px';
        if(pos.includes('n'))w.style.top=top+'px';
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('mouseup',up);
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('pointerup',up);
    });
    w.appendChild(h);
  });
}

function extractQFromText(text,num){
  const m=text.match(new RegExp('<h2[^>]*>\\s*第\\s*'+num+'\\s*[題题]','i'));
  if(!m)return '';
  const from=m.index;
  let to=text.length;
  const nxt=text.slice(from+6).search(/<h2[^>]*>\s*第\s*\d{1,3}\s*[題题]/i);
  if(nxt!==-1)to=from+6+nxt;
  return text.slice(from,to).replace(/<label[^>]*class="saveQ"[\s\S]*?<\/label>/g,'');
}

async function syncLibCards(){

    let text=(n.data&&n.data.text)?n.data.text:'';
    const num=parseInt(card.dataset.num);
    const inner=card.querySelector('.libq-body').innerHTML;
    text=replaceQInText(text,num,inner);

    const styleTxt='.answer{color:#cc0000;font-weight:bold}.solution,.know,.sim{background:#f5f5f5;border:1.5px solid #999;border-radius:8px;padding:14px;margin:10px 0}.know{background:#E3F2FD;border-color:#2196F3}.sim{background:#E8F5E9;border-color:#4CAF50}table{border-collapse:collapse;width:100%;margin:10px 0}th{background:#FFF3CD;border:1px solid #bbb;padding:8px}td{border:1px solid #bbb;padding:8px;vertical-align:top}img{max-width:100%}h2{color:#333;border-left:5px solid #cc0000;padding-left:10px}.saveQ{display:none}';
    const full='<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>'+seg[0]+' '+seg[1]+'</title><style>'+styleTxt+'</style></head><body>'+text+'</body></html>';

async function addToLib(subject,label,file,num){
  const r=await api('/api/library');
  const data=r.data||{subjects:[]};
  let sub=data.subjects.find(s=>s.name===subject);
  if(!sub){
    sub={name:subject,items:[]};
    data.subjects.push(sub);
  }
  if(!sub.items.some(i=>i.label===label&&i.num===num)){
    sub.items.push({label,file,num});
    await api('/api/save_library',{data});
  }
  if(current&&current.subject===subject&&current.label===label){
    const cb=docEl.querySelector('.saveQ input[data-q="'+num+'"]');
    if(cb)cb.checked=true;
  }
  syncLibToCheckboxes();
}
async function removeLibItem(subject,label,num){
  const r=await api('/api/library');
  const data=r.data||{subjects:[]};
  const sub=data.subjects.find(s=>s.name===subject);
  if(sub){
    sub.items=sub.items.filter(i=>!(i.label===label&&i.num===num));
    if(!sub.items.length)data.subjects=data.subjects.filter(s=>s.name!==subject);
  }
  await api('/api/save_library',{data});
  const curLabel=current?(current.origLabel||current.label):'';
  if(current&&current.subject===subject&&curLabel===label){
    const cb=docEl.querySelector('.saveQ input[data-q="'+num+'"]');
    if(cb){
      cb.checked=false;
    }
    if(notes.saved)notes.saved=notes.saved.filter(n=>n!==num);
    scheduleAutoSave();
  }
  syncLibToCheckboxes();
  showToast('🗑️ 已刪除');
  openLib();
}

function printPDF(bodyHtml,title){
  const full='<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>'+title+'</title>'+
    '<style>@page{size:A4;margin:15mm}body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#111;line-height:1.8}'+
    '*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}'+
    'h1{color:#333;border-bottom:3px solid #999;padding-bottom:8px}'+
    'h2{color:#333;border-left:5px solid #cc0000;padding-left:10px;margin-top:38px}'+
    '.answer{color:#cc0000;font-weight:bold}'+
    '.solution,.know,.sim{background:#f5f5f5 !important;border:1.5px solid #999;border-radius:8px;padding:14px;margin:10px 0}'+
    '.know{background:#E3F2FD !important;border-color:#2196F3}'+
    '.sim{background:#E8F5E9 !important;border-color:#4CAF50}'+
    'table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px}'+
    'th{background:#FFF3CD;border:1px solid #bbb;padding:8px}'+
    'td{border:1px solid #bbb;padding:8px;vertical-align:top}'+
    'img{max-width:100%}.saveQ{display:none}</style></head><body><h1>'+title+'</h1>'+bodyHtml+'</body></html>';
  try{
    const iframe=document.createElement('iframe');
    iframe.style.position='fixed';
    iframe.style.right='0';
    iframe.style.bottom='0';
    iframe.style.width='1px';
    iframe.style.height='1px';
    iframe.style.border='0';
    iframe.style.opacity='0';
    iframe.title=title;
    document.body.appendChild(iframe);
    const doc=iframe.contentDocument||iframe.contentWindow.document;
    doc.open();
    doc.write(full);
    doc.close();
    doc.title=title;
    setTimeout(()=>{
      try{
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }catch(e){
        showToast('列印失敗，請改用「另存試卷」HTML 檔在瀏覽器列印');
      }
      const idoc=iframe.contentDocument||iframe.contentWindow.document;
      const cleanup=()=>{
        try{iframe.remove();}catch(e){}
      };
      if(idoc&&idoc.addEventListener){
        idoc.addEventListener('afterprint',cleanup,{once:true});
        setTimeout(cleanup,8000);
      }else{
        setTimeout(cleanup,3000);
      }
    },400);
  }catch(e){
    showToast('列印失敗，請改用「另存試卷」HTML 檔在瀏覽器列印');
  }
}
function stripDupTitle(html,title){
  const t=String(title||'').trim();
  const re=/<h[12][^>]*>[\s\S]*?<\/h[12]>/gi;
  return html.replace(re,function(m){
    let txt=m.replace(/<label[^>]*class="saveQ"[\s\S]*?<\/label>/gi,'');
    txt=txt.replace(/<[^>]+>/g,'').replace(/&nbsp;|&#160;/g,' ').replace(/\s+/g,' ').trim();
    if(txt===t) return '';
    return m;
  });
}

function cnNum(n){
  const d=['零','一','二','三','四','五','六','七','八','九'];
  n=parseInt(n)||0;
  if(n<10)return d[n];
  if(n===10)return '十';
  if(n<20)return '十'+d[n%10];
  if(n<100)return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');
  return String(n);
}

async function startExam(subject,rd){
  stopEditState();

    return;
  }
  const draft=await api('/api/exam_load',{key:subject+'/'+rd.label+'/草稿'});
  const savedAnswers=(draft.ok&&draft.data&&draft.data.draft)?(draft.data.answers||{}):{};
  const doc=new DOMParser().parseFromString(r.html,'text/html');
  const body=doc.body;
  const h2s=Array.from(body.querySelectorAll('h2'));
  const qs=[];
  h2s.forEach((h)=>{
    const m=h.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
    if(!m)return;
    const num=parseInt(m[1]);
    const chunk=document.createElement('div');
    chunk.appendChild(h.cloneNode(true));
    let sib=h.nextSibling;
    while(sib){
      if(sib.nodeType===1&&sib.tagName==='H2')break;

    }
    const pOpt=chunk.querySelector('.options')||Array.from(chunk.querySelectorAll('p,div')).find(e=>/^[A-D][.、]/i.test((e.textContent||'').trim()));
    const options=[];

      const raw=(pOpt.textContent||'').replace(/\s+/g,' ').trim();

async function syncChangedToAllExams(subject,label){
  if(!subject||!label)return;
  const ex=await api('/api/exams');
  const exData=ex.data||{subjects:[]};
  const sub=exData.subjects.find(s=>s.name===subject);

  const base=(n.data&&n.data.text)?n.data.text:'';
  if(!base)return;
  const pd=new DOMParser().parseFromString(base,'text/html');
  const b=pd.body;
  const h2s=new Map();
  b.querySelectorAll('h2').forEach(h=>{
    const m=h.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
    if(m)h2s.set(parseInt(m[1]),h);
  });
  for(const att of lab.attempts){
    if(att.draft)continue;
    const recKey=subject+'/'+label+'/'+att.name;
    const rr=await api('/api/exam_load',{key:recKey});
    if(!rr.ok||!rr.data||!rr.data.html)continue;
    const rec=rr.data;
    const pd3=new DOMParser().parseFromString(rec.html,'text/html');
    const b3=pd3.body;
    b3.querySelectorAll('h2').forEach(h=>{
      const m=h.textContent.match(/第\s*(\d{1,3})\s*[題题]/);
      if(!m)return;
      const num=parseInt(m[1]);
      const newQ=h2s.get(num);
      if(!newQ)return;
      const ndiv=document.createElement('div');
      ndiv.appendChild(newQ.cloneNode(true));
      let s2=newQ.nextSibling;
      while(s2){
        if(s2.nodeType===1&&s2.tagName==='H2')break;
        if(s2.nodeType===3){
          s2=s2.nextSibling;
          continue;
        }
        ndiv.appendChild(s2.cloneNode(true));
        s2=s2.nextSibling;
      }
      ['solution','know','sim'].forEach(cls=>{
        const ob=h.querySelector('.'+cls);
        const nb=ndiv.querySelector('.'+cls);
        if(nb&&ob&&ob.innerHTML!==nb.innerHTML){
          ob.innerHTML=nb.innerHTML;
        }else if(nb&&!ob){
          const ne=document.createElement('div');
          ne.className=cls;
          ne.innerHTML=nb.innerHTML;
          h.after(ne);
        }else if(!nb&&ob){
          ob.remove();
        }
      });
    });
    await api('/api/exam_save',{key:recKey,data:{...rec,html:b3.innerHTML}});
  }
  showToast('💾 詳解筆記已同步到同份考卷所有作答');
}

const STAT_COLORS=['#4f8cff','#39d98a','#f97316','#a855f7','#e11d48','#14b8a6','#eab308','#ec4899','#8b5cf6','#0ea5e9'];
function statColor(name,names){
  const i=names.indexOf(name);
  return STAT_COLORS[(i<0?0:i)%STAT_COLORS.length];
}
function cnNumToNum(name){
  const m=name.match(/^([一二三四五六七八九十]+)次/);
  if(!m)return 0;
  const s=m[1];
  const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(s==='十')return 10;
  if(s.length===1)return map[s]||0;
  if(s[0]==='十')return 10+(map[s[1]]||0);
  if(s[1]==='十')return (map[s[0]]||0)*10+(s.length>2?(map[s[2]]||0):0);
  return 0;
}
function shortAttempt(name){
  const m=name.match(/^([一二三四五六七八九十]+)次做題$/);
  if(!m)return name;
  const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  return (map[m[1]]||m[1])+'次';
}

function drawAllStatsChart(canvas,map,names,labels){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=Math.max(rect.width,320);
  const h=340;
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,w,h);
  const padL=46,padR=20,padT=26,padB=52;
  const pw=w-padL-padR;
  const ph=h-padT-padB;
  ctx.font='12px "Microsoft JhengHei",sans-serif';
  for(let v=0;v<=100;v+=20){
    const y=padT+ph-(v/100)*ph;
    ctx.strokeStyle='#e5e7eb';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(padL,y);
    ctx.lineTo(w-padR,y);
    ctx.stroke();
    ctx.fillStyle='#6b7280';
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.fillText(String(v),padL-8,y);
  }
  /* ═══════ 60 分參考線（黑色粗線） ═══════ */
  const y60=padT+ph-(60/100)*ph;
  ctx.strokeStyle='#111827';
  ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(padL,y60);
  ctx.lineTo(w-padR,y60);
  ctx.stroke();
  ctx.fillStyle='#111827';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  ctx.font='bold 13px "Microsoft JhengHei",sans-serif';
  ctx.fillText('60 分線',padL+6,y60-14);
  const n=labels.length;
  const xAt=i=>n>1?padL+(pw/(n-1))*i:padL+pw/2;
  ctx.textAlign='center';
  ctx.textBaseline='top';
  labels.forEach((lb,i)=>{
    ctx.fillStyle='#6b7280';
    ctx.fillText(lb,xAt(i),padT+ph+8);
  });
  names.forEach(sn=>{
    const color=statColor(sn,names);
    const series=[];
    map.forEach((p)=>{
      if(p.subject!==sn)return;
      const i=labels.indexOf(p.label);
      const x=xAt(i);
      const y=padT+ph-(Math.min(p.score,100)/100)*ph;
      p._x=x;
      p._y=y;
      series.push({x:x,y:y,p:p});
    });
    series.sort((a,b)=>a.x-b.x);
    ctx.strokeStyle=color;
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.beginPath();
    series.forEach((pt,i)=>{
      if(i===0)ctx.moveTo(pt.x,pt.y);
      else ctx.lineTo(pt.x,pt.y);
    });
    ctx.stroke();
    series.forEach(pt=>{
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,5,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=1.5;
      ctx.stroke();
    });
  });
}

async function exportBackup(){
  showToast('⏳ 正在打包備份…');
  try{
    try{
      const r=await api('/api/export_backup_file',{});
      if(r&&r.ok&&r.path){
        showToast('✅ 備份已存到：'+r.path);
        return;
      }
      if(r&&r.ok===false&&r.msg&&r.msg!=='unknown(手機版)'){
        showToast(r.msg);
        return;
      }
    }catch(e){}
    const r2=await api('/api/export_backup',{});
    if(!r2||!r2.ok||!r2.data){
      showToast('❌ 匯出失敗');
      return;
    }
    const json=JSON.stringify(r2.data,null,1);
    const blob=new Blob([json],{type:'application/json'});
    const fname='放射師國考神器-備份-'+new Date().toISOString().slice(0,10)+'.json';
    const file=new File([blob],fname,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'放射師國考神器備份'});
        showToast('✅ 備份已分享（可存到自己的 Google 雲端硬碟）');
        return;
      }catch(e){
        if(e&&e.name==='AbortError')return;
      }
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('✅ 備份已下載（請存到自己的雲端硬碟）');
  }catch(e){
    showToast('❌ 匯出失敗：'+e.message);
  }
}
async function restoreBackup(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0];
    if(!f)return;
    if(!confirm('匯入會覆蓋同名的筆記/試題庫/試卷/考試紀錄，確定繼續？'))return;
    showToast('📥 匯入中…');
    try{
      const txt=await f.text();
      const obj=JSON.parse(txt);
      const r=await api('/api/import_backup',{data:obj});
      if(r&&r.ok){
        showToast('✅ 已匯入 '+r.count+' 筆資料');
        setTimeout(function(){location.reload();},800);
      }else{
        showToast('❌ 匯入失敗');
      }
    }catch(e){
      showToast('❌ 不是有效的備份檔');
    }
    inp.remove();
  };
  inp.click();
}

      hasBackend=true;
      var j=JSON.parse(xhr.responseText);
      if(j&&j.ok){
        /* ✅ 電腦版非首次（資料夾已設）→ 馬上彈（剛剛解鎖 0.3 秒；否則 0.5 秒） */
        setTimeout(showBackupHelpModal, just?300:500);
        return;
      }
    }
  }catch(e){}
  if(!hasBackend){
    /* ✅ 手機版：剛剛解鎖 → 0.3 秒馬上彈；否則 0.5 秒 */
    setTimeout(showBackupHelpModal, just?300:500);
    return;
  }
  /* ✅ 電腦版首次（資料夾還沒設）→ 等選完資料夾再彈 */
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    try{
      var x2=new XMLHttpRequest();
      x2.open('GET','/api/config_ready',false);
      x2.send();
      if(x2.status===200){
        var j2=JSON.parse(x2.responseText);
        if(j2&&j2.ok){
          clearInterval(iv);
          setTimeout(showBackupHelpModal,300);
        }
      }
    }catch(e){}
    if(tries>180)clearInterval(iv);
  },1000);
}
window.addEventListener('beforeunload',function(){
  if(!bkSnooze)return '哆啦呦噠提醒您:記得先按「💾 匯出備份」存到自己的雲端硬碟！祝國考一次過!';
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'&&!bkSnooze){
    setTimeout(function(){showBackupRemindModal();},300);
  }
});
window.addEventListener('resize',updateImgUI);
window.addEventListener('resize',()=>{
  clearTimeout(statsResizeTimer);
  statsResizeTimer=setTimeout(()=>{
    if(statsData&&exam.style.display!=='none'&&document.querySelector('#examBody canvas')){
      showStatsView(statsData);
    }
  },200);
});
/* ═══════ Word 快捷鍵 + A+/A- 快捷（所有筆記編輯處通用） ═══════ */
function currentEditable(){
  const ae=document.activeElement;
  if(ae&&ae.isContentEditable)return ae;
  if(typeof editMode!=='undefined'&&editMode)return docEl;
  if(typeof editModeLib!=='undefined'&&editModeLib){
    if(typeof activeLibBody==='function'){
      const b=activeLibBody();
      if(b)return b;
    }
    const first=libBody.querySelector('.libq-body');
    if(first)return first;
  }
  const cv=document.getElementById('cmpRightR');
  if(cv&&cv.isContentEditable)return cv;
  const wins=document.querySelectorAll('.win');
  for(let i=0;i<wins.length;i++){
    const wbody=wins[i].querySelector('.win-body, .win-right-body');
    if(wbody&&wbody.isContentEditable)return wbody;
  }
  return null;
}
function execShortcut(cmd,val){
  const el=currentEditable();
  if(!el)return false;
  el.focus();
  try{
    document.execCommand('styleWithCSS',false,true);
    document.execCommand(cmd,false,val||null);
  }catch(e){}
  return true;
}
function afterEditableChange(el){
  if(!el)return;
  if(el===docEl){
    noteSnapNow();
    scheduleAutoSave();
    return;
  }
  if(typeof editModeLib!=='undefined'&&editModeLib){
    const card=el.closest('.libq');
    if(card&&typeof markDirty==='function')markDirty(card);
    return;
  }
  if(el.id==='cmpRightR'){
    if(typeof applyCompareEdit==='function')applyCompareEdit(cmpSrc);
    return;
  }
  try{el.dispatchEvent(new Event('input'));}catch(e){}
}
function shortcutFontSel(delta){
  const el=currentEditable();
  if(!el)return;
  if(typeof fontSel!=='function')return;
  const r=fontSel(el,delta);
  if(r){
    afterEditableChange(el);
    showToast('已將選字改為 '+r.size+'px');
  }
}
document.addEventListener('keydown',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  const k=(e.key||'').toLowerCase();
  if(k==='z'&&!e.shiftKey){
    e.preventDefault();
    if(noteUndo.length>1){
      noteRedo.push(noteUndo.pop());
      noteRestore(noteUndo[noteUndo.length-1]);
      showToast('↶ 已復原筆記');
    }
  }else if(k==='y'||(k==='z'&&e.shiftKey)){
    e.preventDefault();
    if(noteRedo.length){
      const s=noteRedo.pop();
      noteUndo.push(s);
      noteRestore(s);
      showToast('↷ 已重做筆記');
    }
  }else if(k==='b'){
    e.preventDefault();
    execShortcut('bold');
    afterEditableChange(currentEditable());
  }else if(k==='i'){
    e.preventDefault();
    execShortcut('italic');
    afterEditableChange(currentEditable());
  }else if(k==='u'){
    e.preventDefault();
    execShortcut('underline');
    afterEditableChange(currentEditable());
  }else if(k==='s'){
    e.preventDefault();
    saveNotes();
    autoSavePaper();
    showToast('💾 已手動儲存');
  }else if(k==='='){
    e.preventDefault();
    if(e.shiftKey)execShortcut('superscript');
    else execShortcut('subscript');
    afterEditableChange(currentEditable());
  }else if(e.key===']'){
    e.preventDefault();
    shortcutFontSel(2);
  }else if(e.key==='['){
    e.preventDefault();
    shortcutFontSel(-2);
  }
},true);
/* ═══════ 按任何格式按鈕時不讓選取消失（A+/A-/B/I/顏色等） ═══════ */
['viewTop','libTools'].forEach(function(tbId){
  const tb=document.getElementById(tbId);
  if(!tb)return;
  tb.addEventListener('mousedown',function(e){
    if(e.target&&(e.target.tagName==='BUTTON'||e.target.matches('.hl-btn'))){
      e.preventDefault();
    }
  });
});
/* ═══════ 手機版（無後端）：隱藏「更改筆記位置」按鈕 ═══════ */
(function(){
  let backend=false;
  try{
    const x=new XMLHttpRequest();
    x.open('GET','/api/index',false);
    x.send();
    if(x.status===200)backend=true;
  }catch(e){}
  if(!backend){
    const b=document.getElementById('btnChangeDir');
    if(b)b.style.display='none';
  }
})();
/* ═══════ 手機版才顯示進度條；電腦版直接載入 ═══════ */
if(window.MOBILE_DATA||window.MOBILE_INDEX){
  bootShow();
  bootSimulate();
  loadIndex().then(function(){bootDone();}).catch(function(){bootDone();});
}else{
  if(!window.MOBILE_INDEX&&!window.MOBILE_DATA){document.body.insertAdjacentHTML('afterbegin','<div style=\"background:#e11d48;color:#fff;padding:10px;text-align:center;font-size:14px;font-weight:700\">⚠️ 資料檔未載入</div>');}
loadIndex();
}
scheduleBackupReminders();
</script>
